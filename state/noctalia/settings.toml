config_version = 14

[bar.main]
capsule = false
end = [ "network_tx", "network_rx", "volume", "tray", "notifications", "clipboard", "battery", "control-center" ]
font_family = "JetBrainsMono NF SemiBold"
font_scale = 1.0499999839812517
start = [ "launcher", "workspaces", "sysmon", "media" ]
thickness = 30
widget_spacing = 18

[theme]
builtin = "Tokyo-Night"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper.default]
path = "~/Pictures/Wallpapers/10.png"

[wallpaper.last]
path = "~/Pictures/Wallpapers/10.png"

[widget.tray]
detached_panel = true
drawer = true
scale = 0.94999999999999996

[widget.workspaces]
active_pill_size = 2.25
pill_scale = 0.84999999999999998
show_labels = false