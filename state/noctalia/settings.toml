config_version = 14

[bar.main]
capsule = false
end = [ "network_tx", "network_rx", "volume", "tray", "notifications", "clipboard", "battery", "control-center" ]
font_family = "JetBrainsMono NF SemiBold"
font_scale = 1.0499999839812517
start = [ "launcher", "workspaces", "sysmon", "media" ]
thickness = 30
widget_spacing = 18

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 683.0
    cy = 586.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
avatar_path = "/mnt/sda2/Data C/Downloads/download.png"

[theme]
builtin = "Tokyo-Night"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper.default]
path = "~/Pictures/Wallpapers/10.png"

[wallpaper.last]
path = "~/Pictures/Wallpapers/10.png"

[wallpaper.monitors.eDP-1]
path = "~/Pictures/Wallpapers/10.png"

[widget.tray]
detached_panel = true
drawer = true
scale = 0.94999999999999996

[widget.workspaces]
active_pill_size = 2.25
pill_scale = 0.84999999999999998
show_labels = false