# Kernel parameters appended to GRUB_CMDLINE_LINUX_DEFAULT.
#
# One token per line. install-system.sh appends anything missing and leaves
# the rest of /etc/default/grub untouched (GRUB_TIMEOUT, theme, and so on
# stay whatever the machine already had).
#
# transparent_hugepage=madvise
#   THP was on `always`, which hands out 2 MiB pages even to processes that
#   only wanted a few KiB. Firefox/Zen allocate small and scattered, so a load
#   that peaked at 4.1 GiB RSS was carrying ~2.1 GiB inside huge pages.
#   `madvise` keeps THP for the workloads that ask for it (databases, VMs,
#   games via madvise(MADV_HUGEPAGE)) and gives everything else plain 4 KiB.
transparent_hugepage=madvise
