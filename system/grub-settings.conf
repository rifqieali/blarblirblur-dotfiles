# Plain GRUB variables, set by install-system.sh.
#
# Format: KEY="value", one per line. install-system.sh rewrites the assignment
# if it differs and leaves every other line in /etc/default/grub alone.
#
# GRUB_THEME points at the theme vendored under system/boot/grub/themes/fox.
# GRUB_GFXMODE is what that theme is drawn for; "auto" keeps a laptop panel
# usable if the mode is not offered.
GRUB_THEME="/boot/grub/themes/fox/theme.txt"
GRUB_GFXMODE="1920x1080,auto"
