# ============================================================================
# Konfigurasi automount USB
# ============================================================================

# Pemilik file hasil mount
USER_NAME=rifqieali
USER_UID=1000
USER_GID=1000

# Mount point
USB_BASE=/mnt/usb
EXTERNAL_BASE=/mnt/eksternal

# Paksa klasifikasi berdasarkan UUID filesystem (pisahkan dengan spasi).
# Isi kalau deteksi otomatis salah tebak.
# HDD eksternal kamu (dari command mount manual):
EKSTERNAL_UUIDS="7db5654e-bb9e-4a42-8132-573bbb69438d"
USB_UUIDS=""

# Ambang deteksi otomatis (GiB):
#   removable=1 dan ukuran < FLASH_MAX_GB   -> flash  (/mnt/usb)
#   rotational=1                            -> HDD    (/mnt/eksternal)
#   ukuran >= EXTERNAL_MIN_GB               -> SSD    (/mnt/eksternal)
FLASH_MAX_GB=256
EXTERNAL_MIN_GB=128

# Filesystem/label yang tidak perlu di-mount
SKIP_FS_TYPES="crypto_LUKS iso9660 udf"
SKIP_LABELS="VTOYEFI"
