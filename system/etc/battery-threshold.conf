# Batas charge baterai ThinkPad.
#
# STOP  : charging berhenti di persen ini.
# START : charging lanjut lagi setelah turun sampai persen ini.
#         START harus lebih kecil dari STOP.
#
# 100/95 = praktis tanpa batas (berhenti di 100%, lanjut lagi di 95%).
# 85/80  = batas harian, paling awet untuk baterai yang sering tercolok.
STOP=100
START=95
