[zram0]
# 75% of RAM, capped at 6 GiB.
#
# zram is swap that lives in RAM, so this is not "free RAM": at the zstd
# ratio seen on this machine (~5:1) a full 5 GiB swap costs about 1 GiB of
# real memory, but incompressible payloads can push that toward 2:1. 75% is
# the point where the extra headroom still pays for itself; past that a full
# zram starts starving the very allocations it was meant to relieve.
zram-size = min(ram * 3 / 4, 6144)
compression-algorithm = zstd
